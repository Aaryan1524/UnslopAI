name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate skill manifests and syntax
        if: hashFiles('scripts/validate-skill.mjs') != ''
        run: node scripts/validate-skill.mjs

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Verify TypeScript assets
        if: hashFiles('package.json') != ''
        run: npm run verify:types

      - name: Cache Playwright Chromium
        if: hashFiles('package-lock.json') != ''
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: hashFiles('package-lock.json') != ''
        run: npx playwright install --with-deps chromium

      - name: Run Playwright fixture verification harness
        if: hashFiles('package.json') != ''
        run: npm run verify
